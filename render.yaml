# Render blueprint for ZakTracking.
#
# The free plan gives 750 instance-hours a month, which covers one service
# running the whole month. A free service sleeps after 15 minutes with no
# traffic - but the cron that registers tracking numbers and sweeps abandoned
# carts runs every 10 minutes anyway, so it keeps the service awake as a side
# effect. No trick needed, and nothing extra to pay for.

services:
  - type: web
    name: zaktracking
    runtime: node
    plan: free
    region: singapore          # closest region to India
    branch: main
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Filled in from the Render dashboard - never commit these.
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false
      - key: CRON_SECRET
        sync: false
